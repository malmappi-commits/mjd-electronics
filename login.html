<!doctype html>
<html>
  <head>
    <title>login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/login.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="login-main-contain">
      <div class="login-inner-contain">
        <div class="image-contain">
          <img src="images/IMG_3239.JPG-removebg-preview.png" />
        </div>
        <div class="header-contain">
          <h1 class="login-header">Login</h1>
        </div>
        <div class="emain-contain">
          <p>Email:</p>
          <input class="email-entry" placeholder="username@gmail.com" />
        </div>
        <div class="password-contain">
          <p>Password:</p>
          <input class="email-entry" placeholder="Password" />
          <p class="forgot-password">Forgot Password?</p>
        </div>
        <button class="sign-in">Sign in</button>
      </div>
    </div>
  </body>
</html>
